<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outback DataSafe</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="login-page" class="page">
            <div class="auth-container">
                <h1>Outback DataSafe</h1>
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>
                
                <form id="login-form" class="auth-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                
                <form id="register-form" class="auth-form hidden">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Password" required>
                    <input type="password" id="register-confirm-password" placeholder="Confirm Password" required>
                    <button type="submit" id="continue-to-plans">Continue</button>
                </form>

                <form id="plans-form" class="auth-form hidden">
                    <h2>Choose Your Storage Plan</h2>
                    <div class="plans-grid" id="plans-grid"></div>
                    <button type="submit" id="complete-registration">Complete Registration</button>
                    <button type="button" id="back-to-register">Back</button>
                </form>
            </div>
        </div>

        <!-- Main Application -->
        <div id="main-app" class="page hidden">
            <nav class="sidebar">
                <div class="logo">DataSafe</div>
                <ul class="nav-menu">
                    <li class="nav-item active" data-view="files">
                        <span class="icon">📁</span>
                        <span>Files</span>
                    </li>
                    <li class="nav-item" data-view="photos">
                        <span class="icon">📷</span>
                        <span>Photos</span>
                    </li>
                    <li class="nav-item" data-view="settings">
                        <span class="icon">⚙️</span>
                        <span>Settings</span>
                    </li>
                </ul>
                <div class="user-info">
                    <div class="quota-info">
                        <div class="quota-bar">
                            <div class="quota-used" id="quota-used"></div>
                        </div>
                        <span id="quota-text">0 GB / 1 TB</span>
                    </div>
                    <button id="logout-btn">Logout</button>
                </div>
            </nav>

            <main class="content">
                <!-- Files View -->
                <div id="files-view" class="view active">
                    <div class="toolbar">
                        <button id="upload-btn">📤 Upload</button>
                        <button id="new-folder-btn">📁 New Folder</button>
                        <input type="file" id="file-input" multiple style="display: none;">
                    </div>
                    <div class="breadcrumb" id="breadcrumb"></div>
                    <div class="file-grid" id="file-grid"></div>
                </div>

                <!-- Photos View -->
                <div id="photos-view" class="view">
                    <div class="toolbar">
                        <button id="upload-photo-btn">📷 Upload Photos</button>
                        <input type="file" id="photo-input" multiple accept="image/*" style="display: none;">
                    </div>
                    <div class="photo-grid" id="photo-grid"></div>
                </div>

                <!-- Settings View -->
                <div id="settings-view" class="view">
                    <div class="settings-container">
                        <h2>Account Settings</h2>
                        <div class="settings-section">
                            <h3>Storage Plan</h3>
                            <div class="current-plan">
                                <span class="plan-label">Current Plan:</span>
                                <span class="plan-value" id="current-plan">Free</span>
                            </div>
                            <div class="storage-usage">
                                <span class="usage-label">Storage Used:</span>
                                <span class="usage-value" id="storage-used">0 GB</span>
                                <span class="usage-label"> / </span>
                                <span class="usage-value" id="storage-total">15 GB</span>
                            </div>
                            <div class="quota-bar-container">
                                <div class="quota-bar">
                                    <div class="quota-used" id="settings-quota-used"></div>
                                </div>
                            </div>
                        </div>
                        <div class="settings-section">
                            <h3>Account Information</h3>
                            <div class="account-info">
                                <div class="info-row">
                                    <span class="info-label">Username:</span>
                                    <span class="info-value" id="settings-username">-</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">Email:</span>
                                    <span class="info-value" id="settings-email">-</span>
                                </div>
                            </div>
                        </div>
                        <div class="settings-section">
                            <h3>Change Password</h3>
                            <form id="change-password-form">
                                <input type="password" id="current-password" placeholder="Current Password" required>
                                <input type="password" id="new-password" placeholder="New Password" required>
                                <input type="password" id="confirm-new-password" placeholder="Confirm New Password" required>
                                <button type="submit">Change Password</button>
                            </form>
                        </div>
                        <div class="settings-section">
                            <h3>Upgrade Plan</h3>
                            <div class="plans-grid" id="settings-plans-grid"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Photo Viewer Modal -->
        <div id="photo-modal" class="modal hidden">
            <button class="close-btn">&times;</button>
            <img id="modal-photo" src="" alt="">
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
